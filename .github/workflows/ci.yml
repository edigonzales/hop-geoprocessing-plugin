name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-type:
    name: Download published Geometry Type dependency
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out Geoprocessing repository
        uses: actions/checkout@v4
      - name: Check out CI helper scripts
        uses: actions/checkout@v4
        with:
          repository: edigonzales/hop-plugin-ci
          ref: main
          path: .ci/hop-plugin-ci
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure Maven repositories
        run: python3 .ci/hop-plugin-ci/scripts/write_maven_settings.py --output "$RUNNER_TEMP/maven-settings.xml"

      - name: Resolve declared Geometry Type version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PYTHON'
          import xml.etree.ElementTree as ET
          value = ET.parse("pom.xml").getroot().findtext("{*}properties/{*}hop.geometry.type.version")
          if not value:
              raise SystemExit("Missing hop.geometry.type.version")
          print(value.strip())
          PYTHON
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download published Geometry Type ZIP
        shell: bash
        env:
          GEOMETRY_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 .ci/hop-plugin-ci/scripts/download_maven_artifact.py \
            --group ch.so.agi --artifact hop-geometry-type-plugin \
            --version "$GEOMETRY_VERSION" --extension zip \
            --maven-settings "$RUNNER_TEMP/maven-settings.xml" \
            --local-repository "$RUNNER_TEMP/geometry-download-m2" \
            --output ".ci/geometry-type/hop-geometry-type-plugin-$GEOMETRY_VERSION.zip"

      - name: Upload published Geometry Type dependency ZIP
        uses: actions/upload-artifact@v4
        with:
          name: hop-geometry-type-dependency
          if-no-files-found: error
          path: .ci/geometry-type/*.zip

  lint:
    name: Lint GitHub Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2

  verify:
    needs: geometry-type
    uses: ./.github/workflows/verify.yml
    with:
      dependency-artifact-name: hop-geometry-type-dependency
      dependency-version: ${{ needs.geometry-type.outputs.version }}

  installed-e2e:
    name: Verify installed plugin with Hop 2.19.0
    needs: [geometry-type, verify]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download verified Geoprocessing bundle
        uses: actions/download-artifact@v4
        with:
          name: hop-geoprocessing-plugin-canonical
          path: .ci/geoprocessing

      - name: Download selected published Geometry Type ZIP
        uses: actions/download-artifact@v4
        with:
          name: hop-geometry-type-dependency
          path: .ci/geometry-type

      - name: Download isolated Hop 2.19.0
        shell: bash
        run: |
          set -euo pipefail
          if ! curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
            https://downloads.apache.org/hop/2.19.0/apache-hop-client-2.19.0.zip -o "$RUNNER_TEMP/hop.zip"; then
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 \
              https://archive.apache.org/dist/hop/2.19.0/apache-hop-client-2.19.0.zip -o "$RUNNER_TEMP/hop.zip"
          fi
          echo "eb227ffe3386480f5ecb59e1d9fdbb16ace15b9ebd9e02da16cdca2c3cadc869f92275b0f607952fb2c5122986839a5b09b2c5762401dad128d8de6b0394643c  $RUNNER_TEMP/hop.zip" | sha512sum -c -

      - name: Install isolated Hop and run packaged E2E
        shell: bash
        run: |
          set -euo pipefail
          unzip -q "$RUNNER_TEMP/hop.zip" -d "$RUNNER_TEMP/isolated-hop"
          unzip -q "$RUNNER_TEMP/hop.zip" -d "$RUNNER_TEMP/isolated-hop-legacy"
          plugin_zip="$(find .ci/geoprocessing -type f -name 'hop-geoprocessing-plugin-*.zip' -print -quit)"
          geometry_zip="$(find .ci/geometry-type -type f -name 'hop-geometry-type-plugin-*.zip' -print -quit)"
          test -n "$plugin_zip"
          test -n "$geometry_zip"
          python3 scripts/run-e2e.py \
            --hop-home "$RUNNER_TEMP/isolated-hop/hop" \
            --plugin-zip "$plugin_zip" \
            --geometry-zip "$geometry_zip" \
            --negative-hop-home "$RUNNER_TEMP/isolated-hop-legacy/hop"

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [lint, verify, installed-e2e]
    uses: edigonzales/hop-plugin-ci/.github/workflows/plugin-publish.yml@main
    with:
      ci-ref: main
      repository-kind: snapshot
      verified-artifact-name: hop-geoprocessing-plugin-canonical
      pom-file: pom.xml
      zip-descriptors: >-
        [{"artifactId":"hop-geoprocessing-plugin","zipGlob":"assemblies/assemblies-hop-geoprocessing-suite/target/hop-geoprocessing-plugin-*.zip","pluginRoot":"plugins/transforms/hop-geoprocessing"}]
      group-id: ch.so.agi
      hop-version: 2.19.0
    secrets:
      MAVEN_USERNAME: ${{ secrets.INTERLIS_MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.INTERLIS_MAVEN_TOKEN }}
