name: Verify Geoprocessing plugin

on:
  workflow_call:
    inputs:
      dependency-artifact-name:
        required: false
        type: string
        default: ''
      dependency-version:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    uses: edigonzales/hop-plugin-ci/.github/workflows/plugin-verify.yml@main
    with:
      ci-ref: main
      java-versions: '["21", "25"]'
      runner-os: '["ubuntu-latest", "macos-15", "windows-latest"]'
      canonical-runner-os: ubuntu-latest
      canonical-java-version: '21'
      maven-working-directory: .
      maven-options: -U -B -ntp
      maven-goals: clean verify
      compatibility-goals: clean test
      pom-file: pom.xml
      zip-descriptors: >-
        [{"artifactId":"hop-geoprocessing-plugin","zipGlob":"assemblies/assemblies-hop-geoprocessing-suite/target/hop-geoprocessing-plugin-*.zip","pluginRoot":"plugins/transforms/hop-geoprocessing"}]
      validation-commands: '["python3 scripts/verify-package.py"]'
      artifact-name-prefix: hop-geoprocessing-plugin
      group-id: ch.so.agi
      hop-version: 2.19.0
      dependency-artifact-name: ${{ inputs.dependency-artifact-name }}
      dependency-artifact-path: .ci/dependencies
      dependency-install: ${{ inputs.dependency-artifact-name != '' }}
      dependency-group-id: ch.so.agi
      dependency-artifact-id: hop-geometry-type
      dependency-version: ${{ inputs.dependency-version }}
      dependency-jar-glob: plugins/misc/hop-geometry-type/*.jar
    secrets: inherit
