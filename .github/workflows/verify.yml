name: Verify Geoprocessing plugin

on:
  workflow_call:
    inputs:
      dependency-artifact-name:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    uses: edigonzales/hop-plugin-ci/.github/workflows/verify.yml@f0a1eec368cb8c5d2592086b26393a6fc3916ad1
    with:
      java-versions: '["21", "25"]'
      runner-os: '["ubuntu-latest", "macos-15", "windows-latest"]'
      canonical-runner-os: ubuntu-latest
      canonical-java-version: '21'
      maven-working-directory: .
      maven-options: -U -B -ntp
      maven-extra-args: -Dmaven.repo.local=.ci/maven-repository
      maven-goals: clean verify
      compatibility-goals: clean test
      pom-file: pom.xml
      artifact-name-prefix: hop-geoprocessing-plugin
      dependency-artifact-name: ${{ inputs.dependency-artifact-name }}
      dependency-artifact-path: .ci/dependencies
      artifacts: >-
        [{"file":"assemblies/assemblies-hop-geoprocessing-suite/target/hop-geoprocessing-plugin-*.zip"}]
      validation-command: |
        python3 scripts/verify-package.py --maven-repository .ci/maven-repository
        python3 -m unittest discover -s scripts/tests -v
        if [[ -n "$DEPENDENCY_ARTIFACT_NAME" ]]; then
          python3 scripts/verify-published-geometry.py --zip-directory .ci/dependencies --maven-repository .ci/maven-repository
        fi
    secrets: inherit
